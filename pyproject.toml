[project]
name = "artex-gym"
version = "0.0.0"
description = "Capture, join, dataset, train and eval loop for ARTEX pentest trajectories"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
]

[project.scripts]
artexctl = "artex_gym.cli.main:app"

[project.optional-dependencies]
# Runtime needs of the llm-logger sidecar only. The CLI does not import these.
collector = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artex_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# SSE fixtures are literal wire bytes; wrapping them would obscure the payload.
"tests/test_collector_proxy.py" = ["E501"]
